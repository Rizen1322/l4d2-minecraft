name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-source-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s passthrough -p 'test_*.py'
      - run: python tools/release_source.py --check
      - run: python tools/release_source.py
      - run: dotnet build companion/L4D2MC.Companion.csproj -c Release
      - run: dotnet build companion/tests/Companion.Tests.csproj -c Release
      - run: ./companion/tests/bin/Release/net48/Companion.Tests.exe
# Full native/Fabric/Source build needs the user's own game and private resources.
# CI deliberately does not upload a game-derived JAR or HUD VPK.
