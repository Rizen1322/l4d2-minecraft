plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"passthrough" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		// dev client: a fixed window size so the camera/projection maths is easy to check
		client {
			programArgs "--width", "1920", "--height", "1080"
			vmArgs "--enable-native-access=ALL-UNNAMED"
		}
	}
}

// Registered after Loom creates its split client source set.
// Private portraits stay in ignored dist/; no game assets are checked into Git.
sourceSets.client.resources.srcDir('../../dist/l4d2mc_hud_assets')

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// WebSocket server the host game's script connects to (FiveM NUI can only speak WebSocket/HTTP)
	implementation "org.java-websocket:Java-WebSocket:1.6.0"
	include "org.java-websocket:Java-WebSocket:1.6.0"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
// Standalone policy checks need little memory; avoid reserving a desktop-sized
// default heap for every fork while both games are already running.
tasks.withType(JavaExec).configureEach {
    if (name.startsWith('verify')) {
        minHeapSize = '16m'
        maxHeapSize = '128m'
    }
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Pure JVM protocol checks; this does not start Minecraft.
tasks.register('verifyGuestMessages', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.rehan.passthrough.GuestMessagesTest'
}
check.dependsOn verifyGuestMessages

// Tests here are standalone main programs run by verifyGuestMessages, not JUnit.
tasks.named('test') { failOnNoDiscoveredTests = false }

