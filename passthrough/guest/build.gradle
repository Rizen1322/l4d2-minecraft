['PeerRoster','FlightPolicy','CoopBlockPolicy','EntityRosterPolicy','PeerAttackPolicy','ProjectileOrigins','MotionTrack'].each { policy ->
    tasks.register('verify'+policy, JavaExec) {
        dependsOn testClasses
        classpath=sourceSets.test.runtimeClasspath
        mainClass='dev.rehan.passthrough.'+policy+'Test'
    }
    check.dependsOn 'verify'+policy
}
